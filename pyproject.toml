[project]
name = "iam-proxy-italia"
version = "3.5.0"
description = "IAM Proxy Italia"
authors = [
    {name = "Giuseppe De Marco",email = "demarcog83@gmail.com"}
]
license = {text = "Apache 2.0"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pip>=26.2",  # CVE-2026-13346
    "setuptools>=84.1.0",  # GHSA-xmj3-9gf7-h52w
    "pysaml2 @ git+https://github.com/peppelinux/pysaml2@pplnx-v7.5.5",
    "satosa>=8.5.1",
    "satosa-oidcop==4.1.0",
    "pyeudiw[satosa] @ git+https://github.com/italia/eudi-wallet-it-python@2.5.0",
    "aiohttp (>=3.14.4,<4.0.0)",  # CVE-2026-111064 et al.; fixed in 3.14.4
    "cbor2 (>=5.9.0)",  # CVE-2026-26209
    "cryptography (>=50.0.0,<=50.0.1)",  # CVE-2026-69247 fixed in 50.0.0; pyeudiw 2.4.0 caps at <=50.0.1
    "cryptojwt (>=1.11.0,<1.12)",  # 1.9.x imports SECT* curves removed in cryptography 46+
    "ecdsa (>=0.19.2)",  # CVE-2024-23342 has no upstream fix; CVE-2026-33936 fixed in 0.19.2
    "pillow (>=13.0.0)",  # CVE-2026-112394 et al.; fixed in 13.0.0
    "requests (>=2.33.0)",  # CVE-2026-25645
    "uwsgi (>=2.0.28,<3.0.0)",
    "werkzeug>=3.1.9"  # CVE-2026-102598; fixed in 3.1.9
]

[project.optional-dependencies]
test = [
    "pytest (>=9.0.3)",  # CVE-2025-71176
    "pytest-cov",
    "flake8",
    "spid-sp-test",
    "pytest-asyncio",
    "pygments (>=2.20.0)",  # CVE-2026-4539
    "pyOpenSSL>=26.0.0",
    "msgpack (>=1.2.3)",  # CVE-2026-114613
    "pip-audit (>=2.10.0,<3.0.0)",
    "lxml (>=6.1.0)",  # CVE-2026-41066: safe resolve_entities default for all parsers
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["backends.cieoidc"]
omit = ["*/endpoints/extend_session_endpoint*", "*/storage/interfaces/storage*","*/utils/handlers/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
