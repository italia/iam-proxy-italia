[wallet]
# Wallet Instance Configuration
wallet_id = wallet_cli_instance
wallet_name = CEN TC Wallet CLI
# Admissible values for wallet_version are : V1_0, V1_3, V1_4
wallet_version = V1_4

# Port for the local Wallet Provider federation metadata server.
port = 3002

# Absolute paths: the loader resolves relative paths against the ini file
# directory (/wct-config), not the process working directory.
wallet_attestations_storage_path = /wallet-conformance-test/data/attestation
credentials_storage_path = /wallet-conformance-test/data/credentials
backup_storage_path = /wallet-conformance-test/data/backup

[issuer]
# Port for the local Mocked Credential Issuer federation metadata server.
port = 3003

[trust]
# X.509 CA Configuration
ca_cert_path = /wallet-conformance-test/data/trust_anchor/localhost
certificate_subject="CN=localhost, O=myOrg, OU=myUnit, C=IT, ST=Roma, L=Roma, E=example@email.it"

# Local trust anchor started by the tool (see [trust_anchor] port).
federation_trust_anchors[] = https://trust-anchor.wct.example.org:3001
federation_trust_anchors_jwks_path = /wallet-conformance-test/data/trust_anchor/localhost

[issuance]
# iam-proxy-italia OpenID4VCI issuer, reached via the satosa-nginx network alias.
url = https://iam-proxy-italia.example.org/OpenID4VCI

# Save the received credential so a later test:presentation can reuse it.
save_credential = true

# redirect_uri is http://localhost:{callback_port}/cb inside this container.
callback_port = 4000

# credentialConfigurationId published by openid4vci_frontend.yaml
credential_types[] = dc_sd_jwt_pid

[presentation]
# Optional: override the directory where presentation test specs are discovered
# tests_dir = ./tests/conformance/presentation

# Engagement mode of the presentation session under test: same-device or cross-device.
# flow_type = cross-device

# Placeholder. Override with CONFIG_PRESENTATION_AUTHORIZE_URI or --presentation-authorize-uri.
authorize_request_url = https://iam-proxy-italia.example.org/OpenID4VP

[network]
timeout = 10
max_retries = 2
user_agent = CEN-TC-Wallet-CLI/1.2.2
# Demo stack uses the locally generated SATOSA certificate.
tls_reject_unauthorized = false
# Other containers on iam-proxy-italia must reach the federation servers.
bind_address = 0.0.0.0

[trust_anchor]
port = 3001
tls_cert_dir = /wallet-conformance-test/data/backup
# Demo issuer trusts trust-anchor.example.org, not this local mock TA.
verify = false

[logging]
log_level = INFO
log_file = /wallet-conformance-test/data/logs/test_run.log
log_format = [%(tag)]: %(message)

[testing]
spec_pattern = **/*.spec.ts
custom_step_pattern = **/*.ts

[steps_mapping]
