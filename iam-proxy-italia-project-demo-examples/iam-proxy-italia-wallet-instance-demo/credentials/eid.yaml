# Credential Attributes Mapping - EID (Electronic Attestation of Person Identification Data)
#
# This file defines the mapping between a common attribute name used in the
# credential template (e.g. graphic/display rendering) and its
# corresponding representation in different credential formats (sd-jwt-vc, mdoc-cbor).
# It allows the system to translate the same credential attribute across formats.
#
# Supported configuration fields for each attribute entry:
#
#   <attribute_name>:           Top-level key representing the attribute name as used in the credential jinja2 template.
#                               It can be a dot-separated path which will be translated into a nested object structure.
#     <format>:                Credential format.
#       namespace: (optional)  The namespace used in mdoc-cbor to group attributes.
#       subgroup: (optional)   A logical subgroup within the credential.
#       element_identifier:    The actual attribute name as used in the specific format.
#                              This is the key that will appear in the issued credential.

metadata.iat:
  sd-jwt-vc:
    element_identifier: "iat"
  mdoc-cbor:
    subgroup: "validityInfo"
    element_identifier: "validFrom"
metadata.exp:
  sd-jwt-vc:
    element_identifier: "exp"
  mdoc-cbor:
    subgroup: "validityInfo"
    element_identifier: "validUntil"
metadata.nbf:
  sd-jwt-vc:
    element_identifier: "nbf"
  mdoc-cbor:
    subgroup: "validityInfo"
    element_identifier: "signed"

given_name:
  sd-jwt-vc:
    element_identifier: "given_name"
  mdoc-cbor:
    namespace: "eu.europa.ec.eudi.pid.1"
    element_identifier: "given_name"

